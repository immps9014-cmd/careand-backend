<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Care& 자동 로그인</title>
<style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#fdf4ef,#fdeee4);font-family:sans-serif}.box{text-align:center}.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#f97316,#ea580c);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin-bottom:16px}p{color:#78716c;font-size:14px}</style>
</head><body><div class="box"><div class="logo">C</div><p id="s">자동 로그인 중…</p></div>
<script>(async()=>{try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'admin@careand.co.kr',password:'test1234'})});const d=await r.json();if(!d.success)throw new Error(d.message);localStorage.setItem('careand-admin-auth',JSON.stringify({state:{user:d.user,accessToken:d.access_token,refreshToken:d.refresh_token,isAuthenticated:true},version:0}));location.replace('/admin/dashboard');}catch(e){document.getElementById('s').textContent='오류: '+e.message;}})();</script>
</body></html>
